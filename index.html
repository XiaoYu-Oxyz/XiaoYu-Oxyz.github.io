<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>404 · 页面走丢了</title>
<style>
  /* ---------- 基础 ---------- */
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #05050a;
    --mx: 0px;
    --my: 0px;
  }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 20px;
    padding: 32px 20px;
    overflow: hidden;
    background: var(--bg);
    color: #f2f3f8;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: rgba(167, 139, 250, .35); color: #fff; }

  /* ---------- 星空画布 ---------- */
  #stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ---------- 背景光斑 ---------- */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
    z-index: 0;
    opacity: .55;
  }
  .glow-1 {
    width: 520px; height: 520px;
    top: -180px; left: -140px;
    background: rgba(56, 189, 248, .38);
    animation: drift 24s ease-in-out infinite;
  }
  .glow-2 {
    width: 460px; height: 460px;
    bottom: -160px; right: -120px;
    background: rgba(167, 139, 250, .42);
    animation: drift 30s ease-in-out infinite reverse;
  }
  .glow-3 {
    width: 380px; height: 380px;
    top: 45%; left: 55%;
    background: rgba(244, 114, 182, .26);
    animation: drift 26s ease-in-out infinite;
    animation-delay: -8s;
  }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(60px, -50px) scale(1.12); }
    66%      { transform: translate(-50px, 55px) scale(.92); }
  }

  /* ---------- 暗角 ---------- */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(
      circle at 50% 42%,
      transparent 0%,
      rgba(5, 5, 10, .45) 62%,
      #05050a 100%
    );
  }

  /* ---------- 主内容 ---------- */
  .stage {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 760px;
    text-align: center;
    transform: translate3d(var(--mx), var(--my), 0);
    transition: transform .8s cubic-bezier(.2, .7, .2, 1);
    will-change: transform;
  }

  /* 入场动画 */
  .reveal {
    opacity: 0;
    animation: reveal .9s cubic-bezier(.2, .7, .2, 1) forwards;
    animation-delay: var(--d, 0s);
  }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(28px); filter: blur(8px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  .eyebrow {
    margin: 0 0 clamp(10px, 2vw, 18px);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .42em;
    text-indent: .42em;
    text-transform: uppercase;
    color: rgba(186, 198, 236, .55);
  }

  /* ---------- 巨大的 404 ---------- */
  .code-wrap {
    position: relative;
    display: inline-block;
    isolation: isolate;
    margin-bottom: clamp(6px, 1.5vw, 14px);
  }
  .code-wrap::before {
    content: "";
    position: absolute;
    inset: 8% -14%;
    z-index: -1;
    background: radial-gradient(
      closest-side,
      rgba(139, 92, 246, .40),
      rgba(56, 189, 248, .16) 55%,
      transparent 78%
    );
    filter: blur(28px);
  }

  .code {
    margin: 0;
    font-size: clamp(5.5rem, 21vw, 13rem);
    font-weight: 900;
    line-height: .88;
    letter-spacing: -.05em;
    background: linear-gradient(115deg, #7dd3fc 0%, #a78bfa 40%, #f0abfc 66%, #f472b6 100%);
    background-size: 220% 220%;
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 10px 44px rgba(129, 140, 248, .38));
    animation: shimmer 9s ease-in-out infinite, bob 7s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(-5px); }
    50%      { transform: translateY(5px); }
  }

  /* ---------- 文案 ---------- */
  .title {
    margin: 0 0 clamp(10px, 2vw, 16px);
    font-size: clamp(1.35rem, 4.2vw, 1.9rem);
    font-weight: 700;
    letter-spacing: .02em;
    color: #f5f6fc;
  }

  .desc {
    margin: 0 auto clamp(30px, 5vw, 42px);
    max-width: 30em;
    font-size: clamp(14px, 2.6vw, 16px);
    line-height: 1.9;
    color: rgba(212, 218, 240, .58);
  }

  /* ---------- 按钮 ---------- */
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 14px 32px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .02em;
    text-decoration: none;
    cursor: pointer;
    transition: transform .28s cubic-bezier(.2, .7, .2, 1),
                box-shadow .28s ease,
                background .28s ease,
                border-color .28s ease;
  }
  .btn:hover  { transform: translateY(-2px); }
  .btn:active { transform: translateY(0) scale(.975); }
  .btn:focus-visible {
    outline: 2px solid #a78bfa;
    outline-offset: 3px;
  }

  .btn-primary {
    color: #08080f;
    background: linear-gradient(135deg, #7dd3fc, #a78bfa 52%, #f472b6);
    background-size: 170% 170%;
    background-position: 0% 50%;
    box-shadow: 0 12px 34px -12px rgba(167, 139, 250, .85),
                inset 0 1px 0 rgba(255, 255, 255, .45);
    transition: transform .28s cubic-bezier(.2, .7, .2, 1),
                box-shadow .28s ease,
                background-position .5s ease;
  }
  .btn-primary:hover {
    background-position: 100% 50%;
    box-shadow: 0 18px 44px -14px rgba(167, 139, 250, 1),
                inset 0 1px 0 rgba(255, 255, 255, .45);
  }

  .btn-ghost {
    color: #e4e7f5;
    background: rgba(255, 255, 255, .055);
    border-color: rgba(255, 255, 255, .14);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .btn-ghost:hover {
    background: rgba(255, 255, 255, .1);
    border-color: rgba(255, 255, 255, .3);
  }

  /* ---------- 页脚 ---------- */
  .footer {
    position: relative;
    z-index: 2;
    margin: 0;
    font-size: 12.5px;
    letter-spacing: .04em;
    color: rgba(186, 198, 236, .34);
    text-align: center;
    animation: reveal .9s cubic-bezier(.2, .7, .2, 1) forwards;
    animation-delay: .75s;
    opacity: 0;
  }
  .footer a {
    color: rgba(196, 181, 253, .78);
    text-decoration: none;
    border-bottom: 1px solid rgba(196, 181, 253, .3);
    padding-bottom: 1px;
    transition: color .25s, border-color .25s;
  }
  .footer a:hover { color: #ddd6fe; border-color: currentColor; }

  /* ---------- 响应式 & 无障碍 ---------- */
  @media (max-width: 480px) {
    .btn { padding: 13px 26px; font-size: 14.5px; }
    .actions { gap: 11px; }
  }

  @media (max-height: 560px) {
    body { padding: 20px 16px; gap: 12px; }
    .desc { margin-bottom: 20px; }
    .code { font-size: clamp(4rem, 16vh, 8rem); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
    .reveal, .footer { opacity: 1 !important; }
  }
</style>
</head>
<body>

  <canvas id="stars" aria-hidden="true"></canvas>

  <div class="glow glow-1" aria-hidden="true"></div>
  <div class="glow glow-2" aria-hidden="true"></div>
  <div class="glow glow-3" aria-hidden="true"></div>

  <main class="stage">
    <p class="eyebrow reveal" style="--d:.05s">Error 404</p>

    <div class="code-wrap reveal" style="--d:.15s">
      <h1 class="code">404</h1>
    </div>

    <h2 class="title reveal" style="--d:.3s">页面走丢了</h2>

    <p class="desc reveal" style="--d:.4s">
      你访问的页面不存在，可能已被移动或删除。<br />
      不如回到首页，重新出发吧。
    </p>

    <div class="actions reveal" style="--d:.52s">
      <a class="btn btn-primary" href="/">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5" />
          <path d="M5.5 9.5V20h13V9.5" />
        </svg>
        返回首页
      </a>
      <button class="btn btn-ghost" type="button" onclick="history.back()">
        返回上一页
      </button>
    </div>
  </main>

  <p class="footer">
    如果你认为这是一个错误，欢迎 <a href="mailto:hello@example.com">联系我们</a>
  </p>

<script>
(function () {
  "use strict";

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- 星空 ---------- */
  var canvas = document.getElementById("stars");
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, stars = [];

  function buildStars() {
    W = canvas.width = Math.floor(window.innerWidth * dpr);
    H = canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    var count = Math.min(180, Math.round((window.innerWidth * window.innerHeight) / 12000));
    stars = [];
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: (Math.random() * 1.3 + 0.4) * dpr,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.016 + 0.004,
        vy: (Math.random() * 0.18 + 0.04) * dpr
      });
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.phase += s.speed;
      s.y -= s.vy;
      if (s.y < -6) {
        s.y = H + 6;
        s.x = Math.random() * W;
      }
      var alpha = 0.22 + (Math.sin(s.phase) * 0.5 + 0.5) * 0.6;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(226,232,255," + alpha.toFixed(3) + ")";
      ctx.fill();
    }
    requestAnimationFrame(render);
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      clearTimeout(t);
      t = setTimeout(fn, wait);
    };
  }

  if (!reduceMotion) {
    buildStars();
    requestAnimationFrame(render);
    window.addEventListener("resize", debounce(buildStars, 200));
  } else {
    // 静态星点，不播放动画
    buildStars();
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(226,232,255,.55)";
      ctx.fill();
    }
  }

  /* ---------- 鼠标视差 ---------- */
  if (!reduceMotion && window.matchMedia("(hover: hover)").matches) {
    var ticking = false;
    window.addEventListener("pointermove", function (e) {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        ticking = false;
        var x = e.clientX / window.innerWidth - 0.5;
        var y = e.clientY / window.innerHeight - 0.5;
        document.documentElement.style.setProperty("--mx", (x * 18).toFixed(2) + "px");
        document.documentElement.style.setProperty("--my", (y * 14).toFixed(2) + "px");
      });
    });
  }
})();
</script>
</body>
</html>
