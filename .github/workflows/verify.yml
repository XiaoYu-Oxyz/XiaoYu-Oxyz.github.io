name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # ::error:: 会以 check annotation 的形式发布；没有 checks:write 会被静默丢弃
  checks: write

# 同一分支的新提交直接取消上一次运行，省额度也避免"旧提交红、新提交绿"的错觉。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + csp + unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node (release signature gate)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"

      - name: Release signature gate
        run: node tools/release.mjs verify

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Validate source data
        run: python tools/validate_data.py

      - name: Docs link check
        run: python tools/check_docs_links.py

      - name: Compatibility lint (Chrome 60 / Safari 11.1 / iOS 12)
        run: python tools/compat_lint.py

      - name: Verify sign page
        run: python tools/build-sign-page.py --check

      - name: Build deployable HTML
        run: python tools/build.py

      - name: Verify CSP hashes and template
        run: python tools/verify.py

      - name: Release signature tests
        run: node tests/release.test.mjs

      - name: Class publish tests
        run: node tests/publish-class.test.mjs

      - name: New class tests
        run: node --test tests/new-class.test.mjs

      - name: Edit grant tests
        run: node tests/sign-grant.test.mjs

      - name: Security drills (delegation + rotation)
        run: node tests/security-drills.mjs

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Ensure generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::构建产物与提交不一致（含新增的 .ics）：请本地运行 tools/build.py 与 tools/verify.py --apply 后一起提交"
            git --no-pager status --porcelain
            git --no-pager diff --stat
            exit 1
          fi

  ui:
    name: ui smoke (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-jammy
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install CJK font (no apt)
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf" \
            https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          fc-cache -f

      - name: UI smoke (Chromium)
        if: matrix.browser == 'chromium'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:ui 2>&1 | tee test-results/ui.log

      - name: UI smoke (WebKit)
        if: matrix.browser == 'webkit'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:ui:webkit 2>&1 | tee test-results/ui.log

      - name: Sign page tests (Chromium)
        if: matrix.browser == 'chromium'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:signpage 2>&1 | tee test-results/signpage.log

      - name: Logic tests (Chromium)
        if: matrix.browser == 'chromium'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:logic 2>&1 | tee test-results/logic.log

      - name: Logic tests (WebKit)
        if: matrix.browser == 'webkit'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:logic:webkit 2>&1 | tee test-results/logic.log

      - name: Week view tests (Chromium)
        if: matrix.browser == 'chromium'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:week 2>&1 | tee test-results/week.log

      - name: Week view tests (WebKit)
        if: matrix.browser == 'webkit'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:week:webkit 2>&1 | tee test-results/week.log

      - name: Visual smoke (Chromium)
        if: matrix.browser == 'chromium'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:visual 2>&1 | tee test-results/visual.log

      - name: Visual smoke (WebKit)
        if: matrix.browser == 'webkit'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:visual:webkit 2>&1 | tee test-results/visual.log

      - name: Surface failures as annotations
        if: failure()
        run: |
          # 注解每步最多显示 10 条，所以只挑"看起来是失败原因"的行，
          # 再用"每个日志最后 4 行"兜底（避免崩在别处时完全没有信息）。
          for f in test-results/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$(basename "$f") 🔎"
            grep -aE '(✗|AssertionError|TimeoutError|Error:|not ok|failed|失败)' "$f" \
              | tail -n 8 | tr -d '\r' | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error::$(basename "$f"): ${line:0:900}"
              done
            echo "::endgroup::"
            echo "::group::$(basename "$f") ⏹ tail"
            tail -n 4 "$f" | tr -d '\r' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::notice::$(basename "$f") tail: ${line:0:400}"
            done
            echo "::endgroup::"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-${{ matrix.browser }}
          path: test-results/visual
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: visual smoke (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-jammy
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install CJK font (no apt)
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf" \
            https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          fc-cache -f

      - name: Visual smoke (${{ matrix.browser }})
        run: |
          mkdir -p test-results
          if [ "${{ matrix.browser }}" = "webkit" ]; then
            npm run test:visual:webkit 2>&1 | tee test-results/visual.log
          else
            npm run test:visual 2>&1 | tee test-results/visual.log
          fi

