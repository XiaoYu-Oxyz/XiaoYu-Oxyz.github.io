name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同一分支的新提交直接取消上一次运行，省额度也避免"旧提交红、新提交绿"的错觉。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + csp + unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build deployable HTML
        run: python build-html.py

      - name: Verify CSP hashes and template
        run: python verify-csp.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Ensure generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::构建产物与提交不一致（含新增的 .ics）：请本地运行 build-html.py 与 verify-csp.py --apply 后一起提交"
            git --no-pager status --porcelain
            git --no-pager diff --stat
            exit 1
          fi

  ui:
    name: ui smoke (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install UI test dependency
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: UI smoke (Chromium)
        if: matrix.browser == 'chromium'
        run: npm run test:ui

      - name: UI smoke (WebKit)
        if: matrix.browser == 'webkit'
        run: npm run test:ui:webkit

      - name: Logic tests (Chromium)
        if: matrix.browser == 'chromium'
        run: npm run test:logic

      - name: Logic tests (WebKit)
        if: matrix.browser == 'webkit'
        run: npm run test:logic:webkit

      - name: Week view tests (Chromium)
        if: matrix.browser == 'chromium'
        run: npm run test:week

      - name: Week view tests (WebKit)
        if: matrix.browser == 'webkit'
        run: npm run test:week:webkit

      - name: Visual smoke (Chromium)
        if: matrix.browser == 'chromium'
        run: npm run test:visual

      - name: Visual smoke (WebKit)
        if: matrix.browser == 'webkit'
        run: npm run test:visual:webkit

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: visual-${{ matrix.browser }}
          path: test-results/visual
          if-no-files-found: ignore
          retention-days: 7
