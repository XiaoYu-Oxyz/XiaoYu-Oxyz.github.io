name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build deployable HTML
        run: python build-html.py

      - name: Verify CSP hashes and template
        run: python verify-csp.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Install UI test dependency
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit

      - name: UI smoke test (Chromium)
        run: npm run test:ui

      - name: UI smoke test (WebKit)
        run: npm run test:ui:webkit

      - name: Ensure generated files are committed
        run: git diff --exit-code
