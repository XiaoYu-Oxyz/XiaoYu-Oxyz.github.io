name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # ::error:: 会以 check annotation 的形式发布；没有 checks:write 会被静默丢弃
  checks: write

# 同一分支的新提交直接取消上一次运行，省额度也避免"旧提交红、新提交绿"的错觉。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + csp + unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Validate source data
        run: python tools/validate_data.py

      - name: Build deployable HTML
        run: python tools/build.py

      - name: Verify CSP hashes and template
        run: python tools/verify.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Ensure generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::构建产物与提交不一致（含新增的 .ics）：请本地运行 tools/build.py 与 tools/verify.py --apply 后一起提交"
            git --no-pager status --porcelain
            git --no-pager diff --stat
            exit 1
          fi

  ui:
    name: ui smoke (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install UI test dependency
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps ${{ matrix.browser }}
          # 无 CJK 字体时中文会渲染成豆腐块，字体度量与真机差很远：
          # 首屏高度、换行、宽度断言都会跟着漂移。
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # 失败时 GitHub 的日志需要登录才能看；把每个测试的输出 tee 到文件，
      # 后面统一转成 ::error:: 注解（公开可读）方便排查。
      - name: UI smoke (Chromium)
        if: matrix.browser == 'chromium'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:ui 2>&1 | tee test-results/ui.log

      - name: UI smoke (WebKit)
        if: matrix.browser == 'webkit'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:ui:webkit 2>&1 | tee test-results/ui.log

      - name: Logic tests (Chromium)
        if: matrix.browser == 'chromium'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:logic 2>&1 | tee test-results/logic.log

      - name: Logic tests (WebKit)
        if: matrix.browser == 'webkit'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:logic:webkit 2>&1 | tee test-results/logic.log

      - name: Week view tests (Chromium)
        if: matrix.browser == 'chromium'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:week 2>&1 | tee test-results/week.log

      - name: Week view tests (WebKit)
        if: matrix.browser == 'webkit'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:week:webkit 2>&1 | tee test-results/week.log

      - name: Visual smoke (Chromium)
        if: matrix.browser == 'chromium'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:visual 2>&1 | tee test-results/visual.log

      - name: Visual smoke (WebKit)
        if: matrix.browser == 'webkit'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:visual:webkit 2>&1 | tee test-results/visual.log

      - name: Surface failures as annotations
        if: failure()
        run: |
          # 注解每步最多显示 10 条，所以只挑"看起来是失败原因"的行，
          # 再用"每个日志最后 4 行"兜底（避免崩在别处时完全没有信息）。
          for f in test-results/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$(basename "$f") 🔎"
            grep -aE '(✗|AssertionError|TimeoutError|Error:|not ok|failed|失败)' "$f" \
              | tail -n 8 | tr -d '\r' | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error::$(basename "$f"): ${line:0:900}"
              done
            echo "::endgroup::"
            echo "::group::$(basename "$f") ⏹ tail"
            tail -n 4 "$f" | tr -d '\r' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::notice::$(basename "$f") tail: ${line:0:400}"
            done
            echo "::endgroup::"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: visual-${{ matrix.browser }}
          path: test-results/visual
          if-no-files-found: ignore
          retention-days: 7
