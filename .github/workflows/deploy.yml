name: deploy

# 只有仓库变量 PAGES_SOURCE=actions 时才会运行：
#   1) 先在 Settings → Pages 把 Source 切到 "GitHub Actions"
#   2) 再在 Settings → Secrets and variables → Actions → Variables 新建 PAGES_SOURCE=actions
# 这样切换过程中不会出现"分支发布 + Actions 发布"双写。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build + verify + deploy
    if: vars.PAGES_SOURCE == 'actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"

      - name: Release signature gate
        run: node tools/release.mjs verify

      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Build deployable HTML
        run: python tools/build.py

      - name: Verify CSP hashes and template
        run: python tools/verify.py

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp index.html 404.html sign.html _site/
          cp -r calendars _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
