name: 新建班级
description: 上传页面导出的班级 xlsx，由 CI 自动生成上线 PR（仅仓库管理员/成员可用）
title: "[新班] "
labels: ["new-class"]
body:
  - type: markdown
    attributes:
      value: |
        **仅管理员/仓库成员可用。** 陌生人提交会被自动拒绝。

        使用步骤：

        1. 在网站里新建班级（例如 `test`），加好数据；
        2. 操作 → 导出 → 选 **xlsx**；
        3. 在下面填班级 id，把 xlsx **拖进**文件框；
        4. 提交后等 1–3 分钟，CI 会自动开一个 PR；
        5. 管理员检查后点 **Squash and merge**。

        注意：
        - 这个模板只用于**新建**班级；已存在的班级请用「班级数据发布」模板；
        - 班级 id 只能字母开头，字母/数字/下划线/短横线，最多 16 位；
        - xlsx 不超过 2 MB。
  - type: input
    id: class_id
    attributes:
      label: 班级 id
      description: 例如 test、Z6、C1；创建后不能改名
      placeholder: test
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: 班级数据（xlsx）
      description: 直接把页面导出的 .xlsx 拖进来，等出现附件链接再提交
      placeholder: 把 xlsx 拖到这里
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这是新班级，且数据已经核对过
          required: true
