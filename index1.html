<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-OtFSrBx7faNyGd1uZuaIsN+Fjly/+xPa4AesT5a+oyE='; script-src-elem 'sha256-OtFSrBx7faNyGd1uZuaIsN+Fjly/+xPa4AesT5a+oyE='; script-src-attr 'none'; style-src 'sha256-08l0Fw6T0CBRiZQkwmWtV07vawHmu76pQwpIEIP11is='; style-src-elem 'sha256-08l0Fw6T0CBRiZQkwmWtV07vawHmu76pQwpIEIP11is='; style-src-attr 'none'; img-src 'none'; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types xlsx-xml">
<meta name="referrer" content="no-referrer">
<title>实验课提醒</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 24px 16px;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    background: #f5f7fa; color: #24292f;
  }
  .wrap {
    max-width: 1100px; margin: 0 auto; background: #fff;
    border-radius: 12px; padding: 24px;
    box-shadow: 0 2px 16px rgba(0,0,0,.08);
  }

  /* 标题行 + 按钮 */
  .head-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; }
  .import-btn {
    padding: 8px 16px; font-size: 14px; font-weight: 600; line-height: 1.4;
    color: #fff; background: #0969da; border: none; border-radius: 8px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
    transition: background .15s;
  }
  .import-btn:hover { background: #0757b8; }
  .import-btn:disabled { background: #8bb8ea; cursor: not-allowed; }
  .ghost-btn {
    padding: 8px 14px; font-size: 13px; font-weight: 600; line-height: 1.4;
    color: #57606a; background: #fff; border: 1px solid #d0d7de; border-radius: 8px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
    transition: background .15s;
  }
  .ghost-btn:hover { background: #f6f8fa; }
  .add-btn {
    padding: 8px 16px; font-size: 14px; font-weight: 600; line-height: 1.4;
    color: #fff; background: #2da44e; border: none; border-radius: 8px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
    transition: background .15s;
  }
  .add-btn:hover { background: #238c42; }

  /* 第 1 周设置行 */
  .settings-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 13px; color: #57606a; margin: 0 0 12px;
  }
  .settings-row label { display: inline-flex; align-items: center; gap: 8px; }
  .settings-row input[type="date"] {
    font-family: inherit; font-size: 13px; color: #24292f;
    padding: 5px 8px; border: 1px solid #d0d7de; border-radius: 6px;
    background: #fff;
  }
  .settings-row input[type="date"]:focus {
    outline: none; border-color: #0969da;
    box-shadow: 0 0 0 3px rgba(9,105,218,.15);
  }
  .settings-hint { color: #8b949e; font-size: 12px; }

  /* 状态提示 */
  .import-status {
    font-size: 13px; line-height: 1.7; margin: 0 0 14px;
    padding: 9px 12px; border-radius: 8px; border: 1px solid transparent;
    display: none; white-space: pre-line; word-break: break-word;
  }
  .import-status.show { display: block; }
  .import-status.ok    { background: #e6f9ea; color: #1a7f37; border-color: #c3f0cd; }
  .import-status.warn  { background: #fff8e1; color: #9a6700; border-color: #f0e0a8; }
  .import-status.error { background: #ffe9e8; color: #a40e26; border-color: #ffc9c7; }

  .clock { font-size: 14px; color: #57606a; margin-bottom: 16px; }
  .clock b { color: #0969da; }
  .saved-tip { color: #2da44e; }

  .legend {
    display: flex; gap: 20px; flex-wrap: wrap;
    font-size: 13px; color: #57606a; margin-bottom: 14px;
  }
  .legend i {
    display: inline-block; width: 13px; height: 13px; border-radius: 3px;
    margin-right: 6px; vertical-align: -2px;
  }
  .dot-today    { background: #ffd7d5; border: 1px solid #e5484d; }
  .dot-tomorrow { background: #d3f5d9; border: 1px solid #2da44e; }
  .dot-past     { background: #eaeef2; border: 1px solid #d0d7de; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; min-width: 860px; border-collapse: collapse; font-size: 14px; }
  thead th {
    background: #f0f3f6; text-align: left; padding: 11px 12px;
    font-weight: 600; color: #424a53; white-space: nowrap;
    border-bottom: 2px solid #d8dee4;
  }
  tbody td { padding: 11px 12px; border-bottom: 1px solid #eaeef2; }
  tbody tr:hover td { filter: brightness(0.97); }

  .row-today td {
    background: #ffe9e8; color: #a40e26; font-weight: 700;
    border-bottom-color: #ffc9c7;
  }
  .row-tomorrow td {
    background: #e6f9ea; color: #1a7f37; font-weight: 700;
    border-bottom-color: #c3f0cd;
  }
  .row-past td { color: #9aa4af; }

  /* ---------- 删除模式 ---------- */
  .delete-btn {
    width: 88px; padding: 8px 0; text-align: center;
    font-size: 13px; font-weight: 600; line-height: 1.4;
    color: #cf222e; background: #fff; border: 1px solid #ffcecb; border-radius: 8px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .delete-btn:hover { background: #ffebe9; border-color: #ff8182; }
  .delete-btn.active {
    color: #fff; background: #cf222e; border-color: #cf222e;
    box-shadow: 0 1px 4px rgba(207,34,46,.25);
  }
  .delete-btn.active:hover { background: #a40e26; border-color: #a40e26; }

  .ghost-btn:disabled, .ghost-btn:disabled:hover,
  .add-btn:disabled, .add-btn:disabled:hover {
    opacity: .45; cursor: not-allowed;
  }
  .ghost-btn:disabled:hover { background: #fff; }
  .add-btn:disabled:hover { background: #2da44e; }

  /* 左侧删除标记列：始终占位，进入删除模式只显示/隐藏图标，表格不位移、行高不变 */
  th.col-mark { width: 46px; }
  td.cell-mark { padding: 8px 4px 8px 10px; line-height: 0; text-align: left; }

  .mark-btn {
    position: relative;
    width: 24px; height: 24px; padding: 0;
    border: 2px solid #cf222e; border-radius: 50%;
    background: #fff; color: #cf222e;
    cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center;
    vertical-align: middle;
    visibility: hidden;
    pointer-events: none;
    transition: background .15s, border-color .15s, color .15s, transform .1s;
  }
  body.deleting .mark-btn { visibility: visible; pointer-events: auto; }
  .mark-btn:hover { background: #ffebe9; }
  .mark-btn:active { transform: scale(.9); }
  .mark-btn:focus-visible { outline: 2px solid #0969da; outline-offset: 2px; }
  .mark-btn::before,
  .mark-btn::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    background: currentColor; border-radius: 1px;
    transform: translate(-50%, -50%);
  }
  .mark-btn::before { width: 11px; height: 2px; }
  .mark-btn::after { width: 2px; height: 11px; display: none; }
  .mark-btn.is-marked { border-color: #2da44e; color: #2da44e; }
  .mark-btn.is-marked:hover { background: #e6f9ea; }
  .mark-btn.is-marked::after { display: block; }

  tbody tr.row-marked td {
    background: #f7f8fa; color: #b0b8c1;
  }
  tbody tr.row-marked td.cell-mark { background: #f7f8fa; }
  tbody tr.row-marked .tag { opacity: .4; }

  .empty-row td {
    text-align: center; color: #8b949e; font-size: 13px;
    line-height: 1.9; padding: 40px 16px; background: #fff;
  }

  .tag {
    display: inline-block; margin-left: 6px; padding: 1px 7px;
    border-radius: 10px; font-size: 11px; font-weight: 700;
    vertical-align: 1px; white-space: nowrap;
  }
  .tag-today    { background: #e5484d; color: #fff; }
  .tag-tomorrow { background: #2da44e; color: #fff; }
  .tag-past     { background: #d8dee4; color: #6e7781; }

  /* ---------- 模态框 ---------- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center;
    padding: 16px; z-index: 100;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 12px; width: 100%; max-width: 460px;
    box-shadow: 0 12px 40px rgba(0,0,0,.2); max-height: 92vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid #eaeef2;
  }
  .modal-head h2 { margin: 0; font-size: 17px; }
  .modal-close {
    width: 30px; height: 30px; border: none; background: transparent;
    font-size: 22px; line-height: 1; color: #57606a; cursor: pointer;
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  .modal-close:hover { background: #f0f3f6; }

  .modal-body {
    padding: 18px 20px 4px; overflow-y: auto;
  }
  .form-row {
    display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px;
  }
  .form-row > label,
  .choice-body label {
    font-size: 13px; font-weight: 600; color: #424a53;
  }
  .form-row .req { color: #e5484d; }
  .form-row input[type="text"],
  .form-row input[type="number"],
  .form-row input[type="date"],
  .form-row select {
    font-family: inherit; font-size: 14px; color: #24292f;
    padding: 8px 10px; border: 1px solid #d0d7de; border-radius: 8px;
    background: #fff; width: 100%;
  }
  .form-row input:focus,
  .form-row select:focus {
    outline: none; border-color: #0969da;
    box-shadow: 0 0 0 3px rgba(9,105,218,.15);
  }
  .form-row input:disabled,
  .form-row select:disabled {
    background: #f6f8fa; color: #8b949e; cursor: not-allowed;
  }

  /* 日期 / 周次+星期：左侧圆圈单选，选中项可编辑，另一项禁用但随动 */
  .form-row.choice-row {
    flex-direction: row; align-items: flex-start; gap: 10px;
  }
  .choice-radio {
    width: 16px; height: 16px; margin: 1px 0 0; flex: none;
    accent-color: #0969da; cursor: pointer;
  }
  .choice-body {
    display: flex; flex-direction: column; gap: 6px;
    flex: 1; min-width: 0;
  }
  .week-pair {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .week-field {
    display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }

  .form-error {
    display: none; font-size: 13px; color: #a40e26;
    background: #ffe9e8; border: 1px solid #ffc9c7; border-radius: 8px;
    padding: 8px 10px; margin-bottom: 14px;
  }
  .form-error.show { display: block; }

  .modal-foot {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 12px 20px 18px;
  }

  /* ---------- 导入方式选择 ---------- */
  .import-modal { max-width: 490px; }
  .import-summary {
    font-size: 13px; line-height: 1.8; color: #424a53;
    background: #f6f8fa; border: 1px solid #eaeef2; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 16px; word-break: break-word;
  }
  .import-summary b { color: #0969da; }
  .mode-cards { display: flex; flex-direction: column; gap: 10px; }
  .mode-card {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 14px; border: 1.5px solid #d0d7de; border-radius: 10px;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .mode-card:hover { background: #f6f8fa; }
  .mode-card.selected { border-color: #0969da; background: #f2f8ff; }
  .mode-card input[type="radio"] {
    margin: 3px 0 0; accent-color: #0969da; flex: none; cursor: pointer;
  }
  .mode-card-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .mode-card-title {
    display: flex; align-items: center; gap: 7px;
    font-size: 14px; font-weight: 700; color: #24292f;
  }
  .mode-badge {
    font-size: 11px; font-weight: 700; line-height: 1.7;
    color: #1a7f37; background: #dafbe1; border: 1px solid #aceebb;
    border-radius: 999px; padding: 0 7px;
  }
  .mode-card-desc { font-size: 12.5px; line-height: 1.6; color: #57606a; }
  .mode-note {
    margin: 14px 0 0; font-size: 12px; line-height: 1.7; color: #8b949e;
  }
  .conflict-box {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    background: #fff8e1; border: 1px solid #f0e0a8;
    font-size: 12.5px; line-height: 1.6; color: #9a6700;
  }
  .conflict-box select {
    display: block; width: 100%; margin-top: 6px;
    font-family: inherit; font-size: 12.5px; padding: 6px 8px;
    border: 1px solid #e6d391; border-radius: 6px; background: #fff; color: #424a53;
  }
  .conflict-box select:focus {
    outline: none; border-color: #9a6700;
    box-shadow: 0 0 0 3px rgba(154,103,0,.12);
  }

  /* ---------- 通用确认框 ---------- */
  .confirm-modal { max-width: 420px; }
  .confirm-msg { margin: 0; font-size: 14px; line-height: 1.8; color: #424a53; }
  .confirm-detail {
    margin-top: 12px; padding: 9px 11px;
    background: #f6f8fa; border-radius: 8px; font-size: 13px;
    line-height: 1.7; color: #57606a; white-space: pre-line; word-break: break-word;
  }
  .danger-btn {
    padding: 8px 16px; font-size: 14px; font-weight: 600; line-height: 1.4;
    color: #fff; background: #cf222e; border: none; border-radius: 8px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
    transition: background .15s;
  }
  .danger-btn:hover { background: #a40e26; }

  /* ---------- 状态提示中的操作按钮 ---------- */
  .status-action {
    margin-left: 8px; padding: 1px 9px; font-size: 12px; font-weight: 700;
    font-family: inherit; color: inherit; background: rgba(255,255,255,.75);
    border: 1px solid currentColor; border-radius: 999px; cursor: pointer;
    transition: background .15s;
  }
  .status-action:hover { background: #fff; }
</style>
</head>
<body>

<div class="wrap">
  <div class="head-row">
    <h1>实验课提醒</h1>
    <div class="head-actions">
      <button class="add-btn"    id="addBtn"        type="button">添加实验</button>
      <button class="delete-btn" id="deleteModeBtn" type="button" aria-pressed="false" title="进入删除模式：点行首圆圈标记，再点完成统一删除">删除实验</button>
      <button class="import-btn" id="importBtn"     type="button">导入 Excel（.xlsx）</button>
      <button class="ghost-btn"  id="exportBtn"     type="button">导出 Excel（.xlsx）</button>
      <button class="ghost-btn"  id="restoreBtn"    type="button">恢复默认数据</button>
    </div>
  </div>

  <div class="settings-row">
    <label>第 1 周星期一：
      <input type="date" id="week1Input">
    </label>
    <span class="settings-hint">修改后自动保存</span>
  </div>

  <div class="import-status" id="importStatus"></div>

  <div class="clock" id="clock">正在读取本机日期…</div>

  <div class="legend">
    <span><i class="dot-today"></i>今天有实验（整行标红）</span>
    <span><i class="dot-tomorrow"></i>明天有实验（整行标绿）</span>
    <span><i class="dot-past"></i>已结束</span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-mark" aria-label="删除标记"></th>
          <th>日期</th>
          <th>周次</th>
          <th>星期</th>
          <th>节次</th>
          <th>实验名称</th>
          <th>实验地点</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- 添加实验模态框 -->
<div class="modal-mask" id="modalMask">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">添加实验</h2>
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row choice-row" id="rowDate">
        <input class="choice-radio" type="radio" name="dateMode" value="date" id="modeDate" aria-label="按日期填写">
        <div class="choice-body">
          <label for="formDate">日期 <span class="req">*</span></label>
          <input type="date" id="formDate" disabled>
        </div>
      </div>

      <div class="form-row choice-row" id="rowWeek">
        <input class="choice-radio" type="radio" name="dateMode" value="week" id="modeWeek" checked aria-label="按周次和星期填写">
        <div class="choice-body">
          <div class="week-pair">
            <div class="week-field">
              <label for="formWeek">周次 <span class="req">*</span></label>
              <input type="number" id="formWeek" min="1" max="1000" step="1" placeholder="例如 3">
            </div>
            <div class="week-field">
              <label for="formWeekday">星期 <span class="req">*</span></label>
              <select id="formWeekday">
                <option value="1">星期一</option>
                <option value="2">星期二</option>
                <option value="3">星期三</option>
                <option value="4">星期四</option>
                <option value="5">星期五</option>
                <option value="6">星期六</option>
                <option value="7">星期日</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="form-row">
        <label>节次 <span class="req">*</span></label>
        <input type="text" id="formPeriod" list="periodList" maxlength="100" placeholder="例如 第3-4节">
        <datalist id="periodList">
          <option value="第1-2节"></option>
          <option value="第3-4节"></option>
          <option value="第5-6节"></option>
          <option value="第7-8节"></option>
          <option value="第3-8节"></option>
        </datalist>
      </div>

      <div class="form-row">
        <label>实验名称 <span class="req">*</span></label>
        <input type="text" id="formName" maxlength="200" placeholder="例如 机械设计">
      </div>

      <div class="form-row">
        <label>实验地点</label>
        <input type="text" id="formPlace" maxlength="200" placeholder="留空则显示“待定”">
      </div>

      <div class="form-error" id="formError"></div>
    </div>
    <div class="modal-foot">
      <button class="ghost-btn" id="modalCancel" type="button">取消</button>
      <button class="add-btn"   id="modalSubmit" type="button">确认添加</button>
    </div>
  </div>
</div>

<!-- 导入方式选择模态框 -->
<div class="modal-mask" id="importMask">
  <div class="modal import-modal" role="dialog" aria-modal="true" aria-labelledby="importTitle">
    <div class="modal-head">
      <h2 id="importTitle">导入 Excel</h2>
      <button class="modal-close" id="importClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
      <div class="import-summary" id="importSummary"></div>

      <div class="mode-cards">
        <label class="mode-card" data-mode="merge">
          <input type="radio" name="importMode" value="merge" checked>
          <span class="mode-card-body">
            <span class="mode-card-title">叠加<span class="mode-badge">推荐</span></span>
            <span class="mode-card-desc" id="mergeDesc"></span>
          </span>
        </label>
        <label class="mode-card" data-mode="replace">
          <input type="radio" name="importMode" value="replace">
          <span class="mode-card-body">
            <span class="mode-card-title">替换</span>
            <span class="mode-card-desc" id="replaceDesc"></span>
          </span>
        </label>
      </div>

      <div class="conflict-box" id="conflictBox" hidden>
        有 <b id="conflictCount">0</b> 条记录与现有实验同名同时间、但地点不同：
        <select id="conflictSelect">
          <option value="keep">保留现有记录，跳过导入的</option>
          <option value="update">用导入的地点更新现有记录</option>
        </select>
      </div>

      <p class="mode-note" id="importNote"></p>
    </div>
    <div class="modal-foot">
      <button class="ghost-btn" id="importCancel" type="button">取消</button>
      <button class="add-btn"   id="importConfirm" type="button">确认导入</button>
    </div>
  </div>
</div>

<!-- 通用确认框 -->
<div class="modal-mask" id="confirmMask">
  <div class="modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-head">
      <h2 id="confirmTitle">请确认</h2>
    </div>
    <div class="modal-body">
      <p class="confirm-msg" id="confirmMsg"></p>
      <div class="confirm-detail" id="confirmDetail" hidden></div>
    </div>

/* ============================================================
   7. xlsx 读写（内置实现，完全离线，不依赖任何网络资源）
   ============================================================ */
const XML_NS_MAIN = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const XML_NS_REL  = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';

// 导入 xlsx 的安全上限，防止 ZIP bomb / XML 膨胀 / 超大表格
const XLSX_LIMITS = {
  fileBytes: 10 * 1024 * 1024,
  entries: 512,
  entryBytes: 20 * 1024 * 1024,
  totalBytes: 50 * 1024 * 1024,
  ratio: 1000,
  xmlBytes: 12 * 1024 * 1024,
  rows: 5000,
  cols: 64,
  cellChars: 2000,
  sharedStrings: 20000,
  sharedChars: 5 * 1024 * 1024
};
const MAX_WEEK = 1000;

function xmlEscape(v) {
  return String(v == null ? '' : v)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;'
    })[c]);
}

function colName(index) {
  let n = index + 1;
  let s = '';
  while (n > 0) {
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function colIndexFromRef(ref) {
  const m = /^([A-Za-z]+)/.exec(String(ref || ''));
  if (!m) return -1;
  let n = 0;
  for (let i = 0; i < m[1].length; i++) {
    n = n * 26 + (m[1].toUpperCase().charCodeAt(i) - 64);
  }
  return n - 1;
}

/* ---------- ZIP 写入（store 方式，不压缩） ---------- */
const ZIP_CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[i] = c >>> 0;
  }
  return table;
})();

function zipCrc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    crc = (crc >>> 8) ^ ZIP_CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function zipDosDateTime(d) {
  return {
    time: ((d.getHours() & 0x1F) << 11) | ((d.getMinutes() & 0x3F) << 5) | ((d.getSeconds() >> 1) & 0x1F),
    date: (((d.getFullYear() - 1980) & 0x7F) << 9) | (((d.getMonth() + 1) & 0x0F) << 5) | (d.getDate() & 0x1F)
  };
}

function zipStore(files) {
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  const dt = zipDosDateTime(new Date());
  let offset = 0;

  files.forEach(f => {
    const nameBytes = enc.encode(f.name);
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
    const crc = zipCrc32(data);

    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);   // 文件名使用 UTF-8
    lv.setUint16(8, 0, true);        // 不压缩
    lv.setUint16(10, dt.time, true);
    lv.setUint16(12, dt.date, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    chunks.push(local, data);

    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dt.time, true);
    cv.setUint16(14, dt.date, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);

    offset += local.length + data.length;
  });

  const cdStart = offset;
  let cdSize = 0;
  central.forEach(c => { chunks.push(c); cdSize += c.length; });

  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, cdStart, true);
  ev.setUint16(20, 0, true);
  chunks.push(eocd);

  let total = 0;
  chunks.forEach(c => { total += c.length; });
  const out = new Uint8Array(total);
  let p = 0;
  chunks.forEach(c => { out.set(c, p); p += c.length; });
  return out;
}

/* ---------- 生成 xlsx ---------- */
function buildXlsxBlob(aoa, sheetName, colWidths) {
  const width = aoa.reduce((m, row) => Math.max(m, row.length), 0);
  const colsXml = (colWidths || []).slice(0, width).map((w, i) =>
    `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`
  ).join('');

  const rowsXml = aoa.map((row, r) => {
    let cells = '';
    for (let c = 0; c < width; c++) {
      const raw = row[c] == null ? '' : row[c];
      const text = String(raw);
      const preserve = /^\s|\s$/.test(text) ? ' xml:space="preserve"' : '';
      cells += `<c r="${colName(c)}${r + 1}" t="inlineStr"><is><t${preserve}>${xmlEscape(text)}</t></is></c>`;
    }
    return `<row r="${r + 1}">${cells}</row>`;
  }).join('');

  const lastRow = Math.max(1, aoa.length);
  const lastCol = colName(Math.max(0, width - 1));

  const sheetXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<worksheet xmlns="${XML_NS_MAIN}">` +
      '<sheetViews><sheetView tabSelected="1" workbookViewId="0">' +
        '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' +
      '</sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="15"/>' +
      (colsXml ? `<cols>${colsXml}</cols>` : '') +
      `<sheetData>${rowsXml}</sheetData>` +
      `<autoFilter ref="A1:${lastCol}${lastRow}"/>` +
    '</worksheet>';

  const workbookXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<workbook xmlns="${XML_NS_MAIN}" xmlns:r="${XML_NS_REL}">` +
      `<sheets><sheet name="${xmlEscape(sheetName || '实验安排')}" sheetId="1" r:id="rId1"/></sheets>` +
    '</workbook>';

  const stylesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<styleSheet xmlns="${XML_NS_MAIN}">` +
      '<fonts count="1"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font></fonts>' +
      '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';

  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    '</Types>';

  const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      `<Relationship Id="rId1" Type="${XML_NS_REL}/officeDocument" Target="xl/workbook.xml"/>` +
    '</Relationships>';

  const workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      `<Relationship Id="rId1" Type="${XML_NS_REL}/worksheet" Target="worksheets/sheet1.xml"/>` +
      `<Relationship Id="rId2" Type="${XML_NS_REL}/styles" Target="styles.xml"/>` +
    '</Relationships>';

  const bytes = zipStore([
    { name: '[Content_Types].xml', data: contentTypes },
    { name: '_rels/.rels', data: rootRels },
    { name: 'xl/workbook.xml', data: workbookXml },
    { name: 'xl/_rels/workbook.xml.rels', data: workbookRels },
    { name: 'xl/styles.xml', data: stylesXml },
    { name: 'xl/worksheets/sheet1.xml', data: sheetXml }
  ]);

  return new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.hidden = true;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(url);
    if (a.parentNode) a.parentNode.removeChild(a);
  }, 1500);
}

/* ---------- 读取 xlsx ---------- */
const XML_POLICY_NAME = 'xlsx-xml';
let xmlPolicy = null;

// DOMParser 在 Trusted Types 下需要 TrustedHTML；这里只开放一个受控策略，
// 仅用于解析已通过大小/DTD 校验的 xlsx XML，不做任何 HTML 渲染。
function asTrustedXml(text) {
  const s = String(text);
  if (typeof trustedTypes === 'undefined' || !trustedTypes.createPolicy) return s;
  if (!xmlPolicy) {
    xmlPolicy = trustedTypes.createPolicy(XML_POLICY_NAME, {
      createHTML: value => {
        const t = String(value);
        if (t.length > XLSX_LIMITS.xmlBytes) throw new Error('xlsx XML 过大');
        if (/<!DOCTYPE|<!ENTITY/i.test(t)) throw new Error('xlsx 包含不安全的 XML 声明');
        return t;
      }
    });
  }
  return xmlPolicy.createHTML(s);
}

function parseXml(text) {
  const s = String(text || '').replace(/^\uFEFF/, '');
  if (s.length > XLSX_LIMITS.xmlBytes) throw new Error('xlsx XML 过大');
  if (/<!DOCTYPE|<!ENTITY/i.test(s)) throw new Error('xlsx 包含不安全的 XML 声明');
  const doc = new DOMParser().parseFromString(asTrustedXml(s), 'application/xml');
  if (!doc || doc.getElementsByTagName('parsererror').length) {
    throw new Error('文件内容不是有效的 XML');
  }
  return doc;
}

function firstChildByLocalName(el, name) {
  if (!el) return null;
  for (let n = el.firstChild; n; n = n.nextSibling) {
    if (n.nodeType === 1 && (n.localName || n.nodeName) === name) return n;
  }
  return null;
}

function collectTextRuns(el, out) {
  if (!el) return out;
  for (let n = el.firstChild; n; n = n.nextSibling) {
    if (n.nodeType !== 1) continue;
    const ln = n.localName || n.nodeName;
    if (ln === 't') out.push(n.textContent == null ? '' : n.textContent);
    else if (ln !== 'rPh') collectTextRuns(n, out);
  }
  return out;
}

function stringItemText(el) {
  return collectTextRuns(el, []).join('');
}

function normalizeZipPath(p) {
  const parts = String(p || '').replace(/\\/g, '/').split('/');
  const out = [];
  for (let i = 0; i < parts.length; i++) {
    const part = parts[i];
    if (!part || part === '.') continue;
    if (part === '..') { if (out.length) out.pop(); }
    else out.push(part);
  }
  return out.join('/');
}

function resolveZipPath(baseDir, target) {
  const t = String(target || '').replace(/\\/g, '/');
  if (t.charAt(0) === '/') return normalizeZipPath(t.slice(1));
  return normalizeZipPath(baseDir + t);
}

function isAllowedEntryName(name) {
  return name === 'xl/workbook.xml'
    || name === 'xl/_rels/workbook.xml.rels'
    || name === 'xl/sharedStrings.xml'
    || /^xl\/worksheets\/[^/]+\.xml$/i.test(name);
}

async function inflateRaw(data, maxBytes) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('当前浏览器不支持解压 xlsx，请使用新版 Edge 或 Chrome 打开');
  }
  let stream;
  try {
    stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  } catch (e) {
    throw new Error('当前浏览器不支持 deflate 解压，请使用新版 Edge 或 Chrome 打开');
  }

  const reader = stream.getReader();
  const chunks = [];
  let total = 0;
  try {
    while (true) {
      const step = await reader.read();
      if (step.done) break;
      total += step.value.byteLength;
      if (total > maxBytes) {
        try { await reader.cancel(); } catch (e) {}
        throw new Error('xlsx 解压数据超过安全上限');
      }
      chunks.push(step.value);
    }
  } finally {
    try { reader.releaseLock(); } catch (e) {}
  }

  const out = new Uint8Array(total);
  let offset = 0;
  for (let i = 0; i < chunks.length; i++) {
    out.set(chunks[i], offset);
    offset += chunks[i].byteLength;
  }
  return out;
}

async function unzipEntries(buffer) {
  const bytes = new Uint8Array(buffer);
  if (bytes.length < 22) throw new Error('不是有效的 xlsx 文件（文件过小）');
  const view = new DataView(buffer, 0, bytes.length);

  let eocd = -1;
  const min = Math.max(0, bytes.length - 22 - 0xFFFF);
  for (let i = bytes.length - 22; i >= min; i--) {
    if (view.getUint32(i, true) === 0x06054b50) {
      const commentLen = view.getUint16(i + 20, true);
      if (i + 22 + commentLen === bytes.length) { eocd = i; break; }
    }
  }
  if (eocd < 0) throw new Error('不是有效的 xlsx 文件（zip 结构缺失）');

  const total = view.getUint16(eocd + 10, true);
  let off = view.getUint32(eocd + 16, true);
  if (!total || off >= bytes.length) throw new Error('不是有效的 xlsx 文件（zip 目录为空）');
  if (total > XLSX_LIMITS.entries) throw new Error('xlsx ZIP 条目过多');

  const decoder = new TextDecoder('utf-8');
  const entries = new Map();
  let totalBytes = 0;

  for (let i = 0; i < total; i++) {
    if (off + 46 > bytes.length || view.getUint32(off, true) !== 0x02014b50) {
      throw new Error('不是有效的 xlsx 文件（zip 目录损坏）');
    }

    const flags = view.getUint16(off + 8, true);
    const method = view.getUint16(off + 10, true);
    const crc = view.getUint32(off + 16, true);
    const compSize = view.getUint32(off + 20, true);
    const uncompSize = view.getUint32(off + 24, true);
    const nameLen = view.getUint16(off + 28, true);
    const extraLen = view.getUint16(off + 30, true);
    const commentLen = view.getUint16(off + 32, true);
    const localOff = view.getUint32(off + 42, true);
    const nextOff = off + 46 + nameLen + extraLen + commentLen;

    if (nextOff > bytes.length) throw new Error('不是有效的 xlsx 文件（zip 目录损坏）');

    const name = decoder.decode(bytes.subarray(off + 46, off + 46 + nameLen));
    const normalized = normalizeZipPath(name);

    // 只读取必要的 XML；图片、主题等未知条目直接跳过，不解压
    if (!isAllowedEntryName(normalized)) {
      off = nextOff;
      continue;
    }
    if (entries.has(normalized)) throw new Error('xlsx ZIP 条目重复');

    if (flags & 1) throw new Error('文件已加密，无法导入');
    if (compSize === 0xFFFFFFFF || uncompSize === 0xFFFFFFFF || localOff === 0xFFFFFFFF) {
      throw new Error('暂不支持 ZIP64 格式的 xlsx 文件');
    }
    if (uncompSize > XLSX_LIMITS.entryBytes || totalBytes + uncompSize > XLSX_LIMITS.totalBytes) {
      throw new Error('xlsx 数据超过安全上限');
    }
    if (localOff + 30 > bytes.length || view.getUint32(localOff, true) !== 0x04034b50) {
      throw new Error('不是有效的 xlsx 文件（zip 数据头损坏）');
    }

    const lFlags = view.getUint16(localOff + 6, true);
    const lMethod = view.getUint16(localOff + 8, true);
    if (lFlags & 1) throw new Error('文件已加密，无法导入');
    if (lMethod !== method) throw new Error('xlsx ZIP 头不一致');

    const lNameLen = view.getUint16(localOff + 26, true);
    const lExtraLen = view.getUint16(localOff + 28, true);
    const dataStart = localOff + 30 + lNameLen + lExtraLen;
    const dataEnd = dataStart + compSize;
    if (dataEnd > bytes.length) throw new Error('不是有效的 xlsx 文件（zip 数据不完整）');

    const raw = bytes.subarray(dataStart, dataEnd);
    const remaining = Math.min(XLSX_LIMITS.entryBytes, XLSX_LIMITS.totalBytes - totalBytes);
    let content;

    if (method === 0) {
      if (raw.length > remaining) throw new Error('xlsx 解压数据超过安全上限');
      content = raw;
    } else if (method === 8) {
      content = await inflateRaw(raw, remaining);
    } else {
      throw new Error('不支持的压缩方式（' + method + '）');
    }

    if (content.length > XLSX_LIMITS.entryBytes || totalBytes + content.length > XLSX_LIMITS.totalBytes) {
      throw new Error('xlsx 解压数据超过安全上限');
    }
    if (compSize > 0 && content.length > compSize * XLSX_LIMITS.ratio) {
      throw new Error('xlsx 压缩比异常');
    }
    if (zipCrc32(content) !== crc) throw new Error('xlsx 数据校验失败');

    totalBytes += content.length;
    entries.set(normalized, content);
    off = nextOff;
  }

  return entries;
}

function excelSerialToDate(serial, date1904) {
  let n = Number(serial);
  if (!isFinite(n) || n <= 0) return null;
  if (date1904) n += 1462;
  const utc = new Date(Math.round((n - 25569) * 86400000));
  if (isNaN(utc.getTime())) return null;
  return new Date(utc.getUTCFullYear(), utc.getUTCMonth(), utc.getUTCDate());
}

async function readXlsxRows(buffer) {
  const entries = await unzipEntries(buffer);
  const decoder = new TextDecoder('utf-8');
  const readText = name => {
    if (!entries.has(name)) return '';
    const bytes = entries.get(name);
    if (bytes.length > XLSX_LIMITS.xmlBytes) throw new Error('xlsx XML 过大');
    const text = decoder.decode(bytes);
    if (text.length > XLSX_LIMITS.xmlBytes) throw new Error('xlsx XML 过大');
    if (/<!DOCTYPE|<!ENTITY/i.test(text)) throw new Error('xlsx 包含不安全的 XML 声明');
    return text;
  };

  const workbookText = readText('xl/workbook.xml');
  if (!workbookText) throw new Error('不是有效的 xlsx 文件（缺少 workbook.xml）');

  const workbookDoc = parseXml(workbookText);
  let date1904 = /<workbookPr\b[^>]*\bdate1904\s*=\s*["'](?:1|true)["']/i.test(workbookText);
  const prEl = workbookDoc.getElementsByTagNameNS('*', 'workbookPr')[0];
  if (prEl && /^(?:1|true)$/i.test(prEl.getAttribute('date1904') || '')) date1904 = true;

  const sheetEls = workbookDoc.getElementsByTagNameNS('*', 'sheet');
  if (sheetEls.length > XLSX_LIMITS.entries) throw new Error('xlsx 工作表数量异常');

  const rels = new Map();
  const relsText = readText('xl/_rels/workbook.xml.rels');
  if (relsText) {
    const relsDoc = parseXml(relsText);
    const relEls = relsDoc.getElementsByTagNameNS('*', 'Relationship');
    if (relEls.length > XLSX_LIMITS.entries) throw new Error('xlsx 关系数量异常');
    for (let i = 0; i < relEls.length; i++) {
      const id = relEls[i].getAttribute('Id');
      if (id) rels.set(id, {
        target: relEls[i].getAttribute('Target') || '',
        type: relEls[i].getAttribute('Type') || ''
      });
    }
  }

  let sheetPath = '';
  let firstTarget = '';
  for (let i = 0; i < sheetEls.length; i++) {
    const rid = sheetEls[i].getAttributeNS(XML_NS_REL, 'id') || sheetEls[i].getAttribute('r:id');
    const rel = rid ? rels.get(rid) : null;
    if (!rel || !rel.target) continue;
    const p = resolveZipPath('xl/', rel.target);
    if (!firstTarget) firstTarget = p;
    if (/\/worksheet$/i.test(rel.type)) { sheetPath = p; break; }
  }
  if (!sheetPath) sheetPath = firstTarget;

  if (!sheetPath || !entries.has(sheetPath)) {
    const candidates = [];
    entries.forEach((v, name) => {
      if (/^xl\/worksheets\/[^/]+\.xml$/i.test(name)) candidates.push(name);
    });
    candidates.sort();
    if (!candidates.length) throw new Error('工作簿中没有工作表');
    sheetPath = candidates[0];
  }

  let shared = [];
  const sharedText = readText('xl/sharedStrings.xml');
  if (sharedText) {
    const sharedDoc = parseXml(sharedText);
    const sis = sharedDoc.getElementsByTagNameNS('*', 'si');
    if (sis.length > XLSX_LIMITS.sharedStrings) throw new Error('xlsx 共享字符串过多');
    let sharedChars = 0;
    for (let i = 0; i < sis.length; i++) {
      const text = stringItemText(sis[i]);
      if (text.length > XLSX_LIMITS.cellChars) throw new Error('xlsx 单元格文本过长');
      sharedChars += text.length;
      if (sharedChars > XLSX_LIMITS.sharedChars) throw new Error('xlsx 共享字符串过大');
      shared.push(text);
    }
  }

  const sheetDoc = parseXml(readText(sheetPath));
  const rowEls = sheetDoc.getElementsByTagNameNS('*', 'row');
  if (rowEls.length > XLSX_LIMITS.rows) throw new Error('xlsx 行数超过安全上限');
  const rows = [];
  let maxCol = 0;

  for (let i = 0; i < rowEls.length; i++) {
    const rowEl = rowEls[i];
    const rNum = parseInt(rowEl.getAttribute('r') || '', 10);
    if (rNum > XLSX_LIMITS.rows) throw new Error('xlsx 行号超过安全上限');
    const rowIndex = rNum > 0 ? rNum - 1 : rows.length;
    if (rowIndex >= XLSX_LIMITS.rows) throw new Error('xlsx 行数超过安全上限');
    const cells = [];
    let nextCol = 0;

    const cellEls = rowEl.getElementsByTagNameNS('*', 'c');
    if (cellEls.length > XLSX_LIMITS.cols) throw new Error('xlsx 列数超过安全上限');
    for (let j = 0; j < cellEls.length; j++) {
      const cEl = cellEls[j];
      let col = colIndexFromRef(cEl.getAttribute('r'));
      if (col < 0) col = nextCol;
      if (col >= XLSX_LIMITS.cols) throw new Error('xlsx 列数超过安全上限');
      nextCol = col + 1;

      const t = cEl.getAttribute('t') || 'n';
      const vEl = firstChildByLocalName(cEl, 'v');
      const isEl = firstChildByLocalName(cEl, 'is');
      const vText = vEl ? String(vEl.textContent == null ? '' : vEl.textContent) : '';
      if (vText.length > XLSX_LIMITS.cellChars) throw new Error('xlsx 单元格文本过长');
      let value = '';

      if (t === 's') {
        const idx = parseInt(vText, 10);
        value = (idx >= 0 && idx < shared.length) ? shared[idx] : '';
      } else if (t === 'inlineStr') {
        value = isEl ? stringItemText(isEl) : vText;
      } else if (t === 'str') {
        value = vText;
      } else if (t === 'b') {
        value = vText === '1';
      } else if (t === 'e') {
        value = '';
      } else if (t === 'd') {
        const d = vText ? new Date(vText) : null;
        value = (d && !isNaN(d.getTime())) ? d : vText;
      } else {
        const trimmed = vText.trim();
        if (trimmed !== '') {
          const num = Number(trimmed);
          value = isFinite(num) ? num : vText;
        }
      }

      if (typeof value === 'string' && value.length > XLSX_LIMITS.cellChars) {
        throw new Error('xlsx 单元格文本过长');
      }

      cells[col] = value;
      if (col + 1 > maxCol) maxCol = col + 1;
    }

    rows[rowIndex] = cells;
  }

  const out = [];
  for (let i = 0; i < rows.length; i++) {
    const src = rows[i] || [];
    const arr = new Array(maxCol);
    for (let j = 0; j < maxCol; j++) arr[j] = src[j] === undefined ? '' : src[j];
    out.push(arr);
  }

  return { rows: out, date1904 };
}

function cellToLocalDate(v, date1904) {
  if (v instanceof Date && !isNaN(v.getTime())) {
    const utcZero = v.getUTCHours() === 0 && v.getUTCMinutes() === 0 && v.getUTCSeconds() === 0;
    const locZero = v.getHours() === 0 && v.getMinutes() === 0 && v.getSeconds() === 0;
    if (utcZero || !locZero) {
      return new Date(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate());
    }
    return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  }
  if (typeof v === 'number' && isFinite(v)) {
    return excelSerialToDate(v, date1904);
  }
  if (typeof v === 'string') {
    const s = v.trim();
    if (!s) return null;
    const m = s.match(/^(\d{4})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})\s*日?$/);
    if (!m) return null;
    const y = +m[1], mo = +m[2], d = +m[3];
    const dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    return dt;
  }
  return null;
}

function isBlankRow(row) {
  if (!row || !row.length) return true;
  return row.every(c => String(c == null ? '' : c).trim() === '');
}

function formatSkipped(skipped) {
  const limit = 5;
  if (skipped.length <= limit) return skipped.join('\n');
  return skipped.slice(0, limit).join('\n') + `\n…另有 ${skipped.length - limit} 行未列出`;
}

async function importXlsx(file) {
  if (!file || typeof file.size !== 'number') throw new Error('无法读取文件');
  if (file.size > XLSX_LIMITS.fileBytes) {
    throw new Error('文件过大，最大支持 ' + Math.round(XLSX_LIMITS.fileBytes / 1024 / 1024) + 'MB');
  }

  const buf = await file.arrayBuffer();
  if (buf.byteLength < 4) throw new Error('不是有效的 xlsx 文件');
  const head = new Uint8Array(buf, 0, 4);
  if (head[0] !== 0x50 || head[1] !== 0x4B || head[2] !== 0x03 || head[3] !== 0x04) {
    throw new Error('不是有效的 xlsx 文件（ZIP 头不正确）');
  }

  let parsed;
  try {
    parsed = await readXlsxRows(buf);
  } catch (e) {
    throw new Error(e && e.message ? e.message : '文件解析失败，可能不是有效的 xlsx 文件');
  }

  const rows = parsed.rows;

  let headerIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    if (!isBlankRow(rows[i])) { headerIdx = i; break; }
  }
  if (headerIdx < 0) throw new Error('工作表为空');

  const headerRow = rows[headerIdx].map(normalizeHeader);

  const colIdx = {};
  ['日期', '周次', '星期', '节次', '实验名称', '实验地点'].forEach(h => {
    const i = headerRow.indexOf(h);
    if (i >= 0) colIdx[h] = i;
  });

  const missingBase = BASE_REQUIRED.filter(h => !(h in colIdx));
  if (missingBase.length) {
    throw new Error('缺少表头【' + missingBase.join('】【') + '】');
  }

  const hasDateCol = '日期' in colIdx;
  const hasWeekCol = '周次' in colIdx;
  const hasWkdCol  = '星期' in colIdx;
  if (!hasDateCol && !(hasWeekCol && hasWkdCol)) {
    throw new Error('缺少【日期】列，或同时提供【周次】和【星期】列');
  }
  const useWeekMode = !hasDateCol;

  const list = [];
  const skipped = [];

  for (let r = headerIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    const rowNo = r + 1;
    if (isBlankRow(row)) continue;
    if (list.length >= MAX_EXPERIMENTS) {
      skipped.push('实验数量超过上限');
      break;
    }

    let dt = null;

    if (!useWeekMode) {
      dt = cellToLocalDate(row[colIdx['日期']], parsed.date1904);
      if (!dt) { skipped.push(`第 ${rowNo} 行：日期无法识别`); continue; }
    } else {
      const wk = parseWeekNo(row[colIdx['周次']]);
      const wd = parseWeekday(row[colIdx['星期']]);
      if (!wk) { skipped.push(`第 ${rowNo} 行：周次无法识别`); continue; }
      if (wk > MAX_WEEK) { skipped.push(`第 ${rowNo} 行：周次超出范围`); continue; }
      if (!wd) { skipped.push(`第 ${rowNo} 行：星期无法识别`); continue; }
      dt = dateFromWeekWeekday(wk, wd);
    }

    const rawName = String(row[colIdx['实验名称']] == null ? '' : row[colIdx['实验名称']]).trim();
    if (!rawName) { skipped.push(`第 ${rowNo} 行：实验名称为空`); continue; }
    if (rawName.length > MAX_NAME_LEN) { skipped.push(`第 ${rowNo} 行：实验名称过长`); continue; }
    const name = cleanText(rawName, MAX_NAME_LEN);
    if (!name) { skipped.push(`第 ${rowNo} 行：实验名称为空`); continue; }

    const rawPeriod = String(row[colIdx['节次']] == null ? '' : row[colIdx['节次']]).trim();
    if (!rawPeriod) { skipped.push(`第 ${rowNo} 行：节次为空`); continue; }
    if (rawPeriod.length > MAX_PERIOD_LEN) { skipped.push(`第 ${rowNo} 行：节次过长`); continue; }
    const period = cleanText(rawPeriod, MAX_PERIOD_LEN);
    if (!period) { skipped.push(`第 ${rowNo} 行：节次为空`); continue; }

    const rawPlace = String(row[colIdx['实验地点']] == null ? '' : row[colIdx['实验地点']]).trim();
    if (rawPlace.length > MAX_PLACE_LEN) { skipped.push(`第 ${rowNo} 行：实验地点过长`); continue; }
    const place = cleanText(rawPlace, MAX_PLACE_LEN) || '待定';

    list.push({ date: toDateStr(dt), period, name, place });
  }

  if (!list.length) {
    throw new Error(
      skipped.length
        ? '没有可导入的有效数据（' + skipped[0] + '）'
        : '没有可导入的有效数据'
    );
  }

  return { list, skipped, useWeekMode };
}

function currentDateMode() {

// 周次 + 星期 → 日期
function updateDateFromWeek() {
  const w = parseInt(formWeek.value, 10);
  const wd = parseInt(formWeekday.value, 10);
  if (Number.isInteger(w) && w >= 1 && w <= MAX_WEEK && Number.isInteger(wd) && wd >= 1 && wd <= 7) {
    formDate.value = toDateStr(dateFromWeekWeekday(w, wd));
  } else {
    formDate.value = '';
  }
}

// 日期 → 周次 + 星期
function updateWeekFromDate() {
  const v = formDate.value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) {
    formWeek.value = '';
    return;
  }
  const d = parseDate(v);
  if (isNaN(d.getTime())) {
    formWeek.value = '';
    return;
  }
  formWeekday.value = String(d.getDay() === 0 ? 7 : d.getDay());
  const w = weekNoOf(d);
  formWeek.value = (w === null) ? '' : String(w);
}

// 选中的一侧可编辑，另一侧禁用但保持同步

});

// 提交
modalSubmit.addEventListener('click', () => {
  const errs = [];
  const mode = currentDateMode();

  let dt = null;
  if (mode === 'date') {
    const v = formDate.value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) {
      errs.push('请选择有效日期');
    } else {
      const d = parseDate(v);
      if (isNaN(d.getTime())) errs.push('日期无效');
      else dt = d;
    }
  } else {
    const w = parseInt(formWeek.value, 10);
    const wd = parseInt(formWeekday.value, 10);
    if (!Number.isInteger(w) || w < 1 || w > MAX_WEEK) {
      errs.push('周次必须是 1-' + MAX_WEEK + ' 的整数');
    } else if (!(wd >= 1 && wd <= 7)) {
      errs.push('请选择星期');
    } else {
      dt = dateFromWeekWeekday(w, wd);
    }
  }

  const rawPeriod = formPeriod.value.trim();
  if (!rawPeriod) errs.push('请填写节次');
  else if (rawPeriod.length > MAX_PERIOD_LEN) errs.push('节次不能超过 ' + MAX_PERIOD_LEN + ' 个字符');
  const period = cleanText(rawPeriod, MAX_PERIOD_LEN);
  if (rawPeriod && !period) errs.push('节次包含无效字符');

  const rawName = formName.value.trim();
  if (!rawName) errs.push('请填写实验名称');
  else if (rawName.length > MAX_NAME_LEN) errs.push('实验名称不能超过 ' + MAX_NAME_LEN + ' 个字符');
  const name = cleanText(rawName, MAX_NAME_LEN);
  if (rawName && !name) errs.push('实验名称包含无效字符');

  const rawPlace = formPlace.value.trim();
  if (rawPlace.length > MAX_PLACE_LEN) errs.push('实验地点不能超过 ' + MAX_PLACE_LEN + ' 个字符');
  const place = cleanText(rawPlace, MAX_PLACE_LEN) || '待定';

  if (errs.length) {
    showFormError(errs.join('；'));
    return;
  }

  experiments.push({ date: toDateStr(dt), period, name, place });

  const savedOk = saveExperiments();
  if (savedOk) usingSaved = true;

  render();
  updateClock();
  closeModal();

  const where = `${toDateStr(dt)} ${period} · ${name}（${place}）`;
  showStatus(
    savedOk ? 'ok' : 'warn',
    savedOk
      ? `已添加实验：${where}，已自动保存`
      : `已添加实验：${where}，但本地保存失败（刷新后会恢复）`
  );
});

    confirmResolve = resolve;

    confirmTitle.textContent = o.title || '请确认';
    confirmMsg.textContent = o.message || '';
    if (o.detail) {

let lastDeleted = null; // 仅保留最近一次「完成」删除的批次，用于撤销

function syncHeaderActions() {
  [addBtn, importBtn, exportBtn, restoreBtn].forEach(btn => {
    btn.disabled = deleteMode;
  });

function setDeleteModeUI(on) {
  deleteMode = on;
  if (!on) markedIndices.clear();

  document.body.classList.toggle('deleting', on);
  deleteModeBtn.textContent = on ? '完成' : '删除实验';
  deleteModeBtn.classList.toggle('active', on);
  deleteModeBtn.setAttribute('aria-pressed', String(on));
  deleteModeBtn.title = on
    ? '完成删除：删除所有已标记的实验'
    : '进入删除模式：点行首圆圈标记，再点完成统一删除';

  syncHeaderActions();
}

function enterDeleteMode() {
  if (!experiments.length) {
    showStatus('warn', '当前没有实验可删除');
    return;
  }

  setDeleteModeUI(true);
  render();
}

function finishDeleteMode() {
  // 先记下待删除的行（按下标升序），再退出删除模式
  const picked = Array.from(markedIndices)
    .sort((a, b) => a - b)
    .map(i => ({ index: i, item: experiments[i] ? { ...experiments[i] } : null }))
    .filter(x => x.item);

  setDeleteModeUI(false);

  if (!picked.length) {
    render();
    showStatus('ok', '已退出删除模式，未删除任何实验');
    return;
  }

  // 从后往前删，保证前面的下标仍然有效
  for (let k = picked.length - 1; k >= 0; k--) {
    experiments.splice(picked[k].index, 1);
  }

  lastDeleted = { items: picked };
  const savedOk = saveExperiments();
  if (savedOk) usingSaved = true;

  render();
  updateClock();

  const names = picked.slice(0, 3).map(x => `${x.item.date} ${x.item.name}`).join('、');
  const detail = picked.length > 3 ? `${names} 等 ${picked.length} 条` : names;

  showStatus(
    savedOk ? 'ok' : 'warn',
    `已删除 ${picked.length} 条实验：${detail}` +
      (savedOk ? '' : '；本地保存失败，刷新后会恢复'),
    { label: '撤销', onClick: undoLastDelete }
  );
}

function undoLastDelete() {
  const batch = lastDeleted && lastDeleted.items;
  if (!batch || !batch.length) return;
  lastDeleted = null;

  // 按原下标从小到大插回，位置与删除前一致
  batch.slice().sort((a, b) => a.index - b.index).forEach(entry => {
    const at = Math.min(Math.max(entry.index, 0), experiments.length);
    experiments.splice(at, 0, { ...entry.item });
  });

  const savedOk = saveExperiments();
  if (savedOk) usingSaved = true;

  render();
  updateClock();

  showStatus(
    savedOk ? 'ok' : 'warn',
    `已恢复 ${batch.length} 条实验` + (savedOk ? '' : '；本地保存失败')
  );
}

deleteModeBtn.addEventListener('click', () => {
  if (deleteMode) finishDeleteMode();
  else enterDeleteMode();
});

// 删除模式下，点左侧圆圈切换该行的待删除标记
document.getElementById('tbody').addEventListener('click', (ev) => {
  if (!deleteMode) return;

  const target = ev.target;
  const btn = target && target.closest ? target.closest('button[data-action="mark"]') : null;
  if (!btn) return;

  const idx = Number(btn.dataset.idx);
  if (!experiments[idx]) return;

  if (markedIndices.has(idx)) markedIndices.delete(idx);
  else markedIndices.add(idx);

  const marked = markedIndices.has(idx);
  btn.classList.toggle('is-marked', marked);
  btn.setAttribute('aria-pressed', String(marked));
  btn.title = marked ? '取消删除标记' : '标记为待删除';
  btn.setAttribute('aria-label', btn.title);

  const row = btn.closest('tr');
  if (row) row.classList.toggle('row-marked', marked);
});

const importMask       = document.getElementById('importMask');
const importClose      = document.getElementById('importClose');
const importCancelBtn  = document.getElementById('importCancel');
const importConfirmBtn = document.getElementById('importConfirm');
const importSummary    = document.getElementById('importSummary');
const mergeDesc        = document.getElementById('mergeDesc');
const replaceDesc      = document.getElementById('replaceDesc');
const importNote       = document.getElementById('importNote');
const conflictBox      = document.getElementById('conflictBox');
const conflictCountEl  = document.getElementById('conflictCount');
const conflictSelect   = document.getElementById('conflictSelect');

const IMPORT_NOTE_MERGE =
  '叠加规则：日期、节次、实验名称都相同的记录视为同一条，自动跳过；若地点不同，也视为同一条，默认保留现有记录。';
const IMPORT_NOTE_REPLACE =
  '替换会清空当前表格中的全部实验，只保留本次导入的数据，操作后无法撤销。';

let pendingImport = null;

function selectedImportMode() {
  const el = document.querySelector('input[name="importMode"]:checked');
  return el ? el.value : 'merge';
}

/**
 * 合并去重
 *  - 判重依据：日期 + 节次 + 实验名称（做全角/空白/横线规整后比较）
 *  - 完全重复（地点也相同）：跳过
 *  - 同名同时间但地点不同：默认保留现有记录；updatePlace 为 true 时改用导入的地点
 */
function mergeExperiments(existing, incoming, opts) {
  const updatePlace = !!(opts && opts.updatePlace);
  const list = existing.map(e => ({ ...e }));
  const index = new Map();
  list.forEach((e, i) => index.set(expIdentity(e), i));

  const added = [];
  const duplicates = [];
  const conflicts = [];
  const updated = [];

  incoming.forEach(src => {
    const item = { ...src };
    const key = expIdentity(item);
    const pos = index.get(key);

    if (pos === undefined) {
      index.set(key, list.length);
      list.push(item);
      added.push(item);
      return;
    }

    const cur = list[pos];
    if (normKeyText(cur.place) === normKeyText(item.place)) {
      duplicates.push(item);
      return;
    }

    if (updatePlace) {
      conflicts.push({ before: cur.place, after: item.place, updated: true });
      updated.push(item);
      cur.place = item.place;
    } else {
      conflicts.push({ before: cur.place, after: item.place, updated: false });
    }
  });

  return { list, added, duplicates, conflicts, updated };
}

function countSkippedDup(preview) {
  return preview.duplicates.length + preview.conflicts.filter(c => !c.updated).length;
}

function renderImportPreview() {
  if (!pendingImport) return;

  const preview = mergeExperiments(experiments, pendingImport.list, {
    updatePlace: conflictSelect.value === 'update'
  });

  const parts = [`保留现有 ${experiments.length} 条`];
  if (preview.added.length) parts.push(`新增 ${preview.added.length} 条`);
  else parts.push('没有可新增的记录');

  const skipped = countSkippedDup(preview);
  if (skipped) parts.push(`跳过重复 ${skipped} 条`);
  if (preview.updated.length) parts.push(`更新地点 ${preview.updated.length} 条`);
  mergeDesc.textContent = parts.join('，') + '。';

  replaceDesc.textContent =
    `清空现有 ${experiments.length} 条记录，改用导入的 ${pendingImport.list.length} 条。`;

  conflictCountEl.textContent = String(preview.conflicts.length);
  conflictBox.hidden = !(selectedImportMode() === 'merge' && preview.conflicts.length > 0);
}

function syncImportModeCards() {
  const mode = selectedImportMode();
  document.querySelectorAll('.mode-card').forEach(card => {
    card.classList.toggle('selected', card.dataset.mode === mode);
  });
  importNote.textContent = mode === 'replace' ? IMPORT_NOTE_REPLACE : IMPORT_NOTE_MERGE;
  renderImportPreview();
}

document.querySelectorAll('input[name="importMode"]').forEach(el => {
  el.addEventListener('change', syncImportModeCards);
});
conflictSelect.addEventListener('change', renderImportPreview);

function openImportModal(data) {
  // 若读取文件期间进入了删除模式，先退出，避免标记下标与导入后的数据错位
  if (deleteMode) {
    setDeleteModeUI(false);
    render();
  }

  pendingImport = data;
  document.querySelector('input[name="importMode"][value="merge"]').checked = true;
  conflictSelect.value = 'keep';

  const skipTip = data.skipped.length ? `，忽略 ${data.skipped.length} 行无法识别的数据` : '';
  importSummary.replaceChildren();

  const fileLine = document.createElement('div');
  fileLine.appendChild(document.createTextNode('文件：'));
  const fileB = document.createElement('b');
  fileB.textContent = cleanText(data.fileName, 160);
  fileLine.appendChild(fileB);
  importSummary.appendChild(fileLine);

  const countLine = document.createElement('div');
  countLine.appendChild(document.createTextNode('有效记录 '));
  const countB = document.createElement('b');
  countB.textContent = String(data.list.length);
  countLine.appendChild(countB);
  countLine.appendChild(document.createTextNode(' 条' + skipTip));
  importSummary.appendChild(countLine);

  const currentLine = document.createElement('div');
  currentLine.appendChild(document.createTextNode('当前表格已有 '));
  const currentB = document.createElement('b');
  currentB.textContent = String(experiments.length);
  currentLine.appendChild(currentB);
  currentLine.appendChild(document.createTextNode(' 条记录'));
  importSummary.appendChild(currentLine);

  syncImportModeCards();
  importMask.classList.add('show');
  setTimeout(() => { try { importConfirmBtn.focus(); } catch (e) {} }, 0);
}

function closeImportModal() {
  importMask.classList.remove('show');
  pendingImport = null;
}

importClose.addEventListener('click', closeImportModal);
importCancelBtn.addEventListener('click', closeImportModal);
importMask.addEventListener('click', (e) => {
  if (e.target === importMask) closeImportModal();
});

importConfirmBtn.addEventListener('click', () => {
  if (!pendingImport) return;

  const mode = selectedImportMode();
  const updatePlace = conflictSelect.value === 'update';
  const { list, skipped, useWeekMode } = pendingImport;

  let mergeInfo = null;
  if (mode === 'replace') {
    experiments = list.map(e => ({ ...e }));
  } else {
    mergeInfo = mergeExperiments(experiments, list, { updatePlace });
    experiments = mergeInfo.list;
  }

  lastDeleted = null;
  const savedOk = saveExperiments();
  if (savedOk) usingSaved = true;

  render();
  updateClock();
  closeImportModal();

  const modeTip = useWeekMode ? '（按周次 + 星期推算日期）' : '';
  const lines = [];

  if (mode === 'replace') {
    lines.push(`已用导入文件替换全部实验：共 ${list.length} 条${modeTip}`);
  } else {
    const bits = [`新增 ${mergeInfo.added.length} 条`];
    const skippedDup = countSkippedDup(mergeInfo);
    if (skippedDup) bits.push(`跳过重复 ${skippedDup} 条`);
    if (mergeInfo.updated.length) bits.push(`更新地点 ${mergeInfo.updated.length} 条`);
    lines.push(`已叠加导入：${bits.join('，')}，当前共 ${experiments.length} 条${modeTip}`);
  }

  if (mergeInfo && mergeInfo.conflicts.length) {
    const kept = mergeInfo.conflicts.filter(c => !c.updated).length;
    if (kept) lines.push(`· 其中 ${kept} 条与现有记录同名同时间但地点不同，已保留原有地点`);
  }

  if (skipped.length) {
    lines.push(`· 跳过 ${skipped.length} 行无法识别的数据：\n` + formatSkipped(skipped));
  }
  if (!savedOk) lines.push('· 本地保存失败，刷新后会恢复为之前的数据');

  showStatus(skipped.length || !savedOk ? 'warn' : 'ok', lines.join('\n'));
});

importBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const file = fileInput.files && fileInput.files[0];
  fileInput.value = '';
  if (!file) return;

  if (!/\.xlsx$/i.test(file.name)) {
    showStatus('error', '导入失败：请选择 .xlsx 格式的文件');
    return;
  }

  const oldText = importBtn.textContent;
  importBtn.disabled = true;
  importBtn.textContent = '正在读取…';
  statusEl.className = 'import-status';

  try {
    const data = await importXlsx(file);
    data.fileName = file.name;
    openImportModal(data);
  } catch (err) {
    showStatus('error', '导入失败：' + (err && err.message ? err.message : String(err)));
  } finally {
    importBtn.disabled = deleteMode;
    importBtn.textContent = oldText;
  }
});


/* ============================================================
   15. 导出 Excel
   ============================================================ */
function exportXlsx() {
  if (!experiments.length) {
    showStatus('warn', '当前没有实验数据可导出，请先添加或导入实验');
    return;
  }

  try {
    const rows = experiments
      .map((e, i) => ({ ...e, _date: parseDate(e.date), _idx: i }))
      .sort((a, b) => (a._date - b._date) || (a._idx - b._idx));

    const aoa = [EXPORT_HEADERS.slice()];
    rows.forEach(e => {
      const wk = weekNoOf(e._date);
      aoa.push([
        e.date,
        wk === null ? '—' : '第' + wk + '周',
        WEEK_NAMES[e._date.getDay()],
        e.period,
        e.name,
        e.place
      ]);
    });

    const blob = buildXlsxBlob(aoa, EXPORT_SHEET_NAME, EXPORT_COL_WIDTHS);
    const fileName = `实验安排_${toDateStr(new Date())}.xlsx`;
    downloadBlob(blob, fileName);

    showStatus('ok', `已导出 ${rows.length} 条实验安排：${fileName}`);
  } catch (err) {
    showStatus('error', '导出失败：' + (err && err.message ? err.message : String(err)));
  }
}

exportBtn.addEventListener('click', exportXlsx);


/* ============================================================
   16. 恢复默认数据
   ============================================================ */
restoreBtn.addEventListener('click', async () => {
  const ok = await askConfirm({
    title: '恢复默认数据',
    message: '确定恢复为默认数据吗？所有已添加、导入、删除的结果都会被清除（第 1 周设置不受影响）。',
    okText: '恢复默认'
  });
  if (!ok) return;

  experiments = DEFAULT_EXPERIMENTS.map(e => ({ ...e }));
  usingSaved = false;
  lastDeleted = null;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  try { localStorage.removeItem(LEGACY_STORAGE_KEY); } catch (e) {}

  render();
  updateClock();
  showStatus('ok', '已恢复为默认数据，并清除了本机保存的实验数据');
});


/* ============================================================
   17. 全局键盘 & 初始渲染
   ============================================================ */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (confirmMask.classList.contains('show')) { settleConfirm(false); return; }
  if (importMask.classList.contains('show')) { closeImportModal(); return; }
  if (modalMask.classList.contains('show')) closeModal();
});

syncDateModeUI();
syncImportModeCards();
updateClock();
render();
</script>
